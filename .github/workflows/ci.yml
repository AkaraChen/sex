name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run lint
      - run: bun test

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The binary converts documents on its own (here-docs embedded, nothing beside it)
        run: |
          mkdir "$RUNNER_TEMP/alone" && cp dist/sex "$RUNNER_TEMP/alone/"
          (cd test/fixtures && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          cd "$RUNNER_TEMP/alone"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          ./sex fetch http://127.0.0.1:8765/report.docx --docs | tee out.md
          grep -q "| EMEA | 42 |" out.md
          ./sex fetch http://127.0.0.1:8765/scan.pdf --docs | grep -q "Scanned invoice 4711"
      - name: The binary runs its embedded Lightpanda and SearXNG (nothing on PATH)
        run: |
          cd "$RUNNER_TEMP/alone"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache" PATH=/usr/bin:/bin
          ./sex fetch http://127.0.0.1:8765/ --lightpanda --allow-private-network --log-level info 2>err.log | grep -q "report.docx"
          grep -q "lightpanda started" err.log
          ./sex serve --port 3002 --data-dir "$RUNNER_TEMP/data" &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3002/health > health.json && break; sleep 1; done
          cat health.json
          grep -q '"searxng":"managed (http' health.json
          kill %1

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The same release dist/sex embeds: version and SHA-256 are pinned in scripts/lightpanda.ts.
      - run: bun scripts/lightpanda.ts "$RUNNER_TEMP/lightpanda"
      - run: bun test test/browser.test.ts
        env:
          SEX_TEST_LIGHTPANDA_PATH: ${{ runner.temp }}/lightpanda
