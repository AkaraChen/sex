name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # Published packages run on Node too: build them, then test the dist.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run test:node

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The binary converts documents on its own (here-docs embedded, nothing beside it)
        run: |
          mkdir "$RUNNER_TEMP/alone" && cp dist/sex "$RUNNER_TEMP/alone/"
          (cd apps/sex/test/fixtures && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          cd "$RUNNER_TEMP/alone"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          ./sex fetch http://127.0.0.1:8765/report.docx --docs | tee out.md
          grep -q "| EMEA | 42 |" out.md
          ./sex fetch http://127.0.0.1:8765/scan.pdf --docs | grep -q "Scanned invoice 4711"
      - name: The binary runs its embedded Lightpanda and SearXNG (nothing on PATH)
        run: |
          cd "$RUNNER_TEMP/alone"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache" PATH=/usr/bin:/bin
          ./sex fetch http://127.0.0.1:8765/ --lightpanda --allow-private-network --log-level info 2>err.log | grep -q "report.docx"
          grep -q "lightpanda started" err.log
          ./sex serve --port 3002 --data-dir "$RUNNER_TEMP/data" &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3002/health > health.json && break; sleep 1; done
          cat health.json
          grep -q '"searxng":"managed (http' health.json
          kill %1
      - run: bun run build:lite
      - name: The lite binary fetches and runs its embedded SearXNG (nothing on PATH)
        run: |
          mkdir "$RUNNER_TEMP/lite" && cp dist/sex-lite "$RUNNER_TEMP/lite/"
          cd "$RUNNER_TEMP/lite"
          export XDG_CACHE_HOME="$RUNNER_TEMP/lite-cache" PATH=/usr/bin:/bin
          ./sex-lite fetch http://127.0.0.1:8765/ -f links | grep -q "report.docx"
          ./sex-lite serve --port 3003 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3003/health > health.json && break; sleep 1; done
          cat health.json
          grep -q '"searxng":"managed (http' health.json
          kill %1

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The same release dist/sex embeds: version and SHA-256 are pinned in apps/sex/scripts/lightpanda.ts.
      - run: bun apps/sex/scripts/lightpanda.ts "$RUNNER_TEMP/lightpanda"
      - run: bun test --conditions sex-source apps/sex/test/browser.test.ts apps/sex/test/browser-proxy.test.ts
        env:
          SEX_TEST_LIGHTPANDA_PATH: ${{ runner.temp }}/lightpanda

  # The same browser tests through --cdp-url, against the Chrome preinstalled on the runner.
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Start headless Chrome
        run: |
          google-chrome --version
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/chrome" about:blank >"$RUNNER_TEMP/chrome.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9222/json/version && break; sleep 1; done
      - run: bun test --conditions sex-source apps/sex/test/browser.test.ts apps/sex/test/browser-fallback.test.ts apps/sex/test/abort.test.ts apps/sex/test/browser-proxy.test.ts apps/sex/test/egress-browser.test.ts
        env:
          SEX_TEST_CDP_URL: http://127.0.0.1:9222
      - if: failure()
        run: tail -50 "$RUNNER_TEMP/chrome.log"

  s3:
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_ACCESS_KEY_ID: sex
      S3_SECRET_ACCESS_KEY: sex-secret
      S3_REGION: us-east-1
      SEX_TEST_S3_URL: s3://sex-test/ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # MinIO no longer publishes images on Docker Hub, so the S3 server is SeaweedFS. It runs with `docker run` rather
      # than as a service container because it needs a command (`server -s3`); the bucket is created on first write.
      - name: Start an S3 server (SeaweedFS)
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            chrislusf/seaweedfs:4.48 server -s3 -dir=/data -ip.bind=0.0.0.0
          for i in $(seq 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/)" != "000" ] && break
            sleep 1
          done
      - run: bun test --conditions sex-source apps/sex/test/store-contract.test.ts apps/sex/test/durability.test.ts
