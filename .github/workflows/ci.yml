name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run lint
      - run: bun test

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The binary converts documents on its own (here-docs embedded, nothing beside it)
        run: |
          mkdir "$RUNNER_TEMP/alone" && cp dist/sex "$RUNNER_TEMP/alone/"
          (cd test/fixtures && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          cd "$RUNNER_TEMP/alone"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          ./sex fetch http://127.0.0.1:8765/report.docx --docs | tee out.md
          grep -q "| EMEA | 42 |" out.md
          ./sex fetch http://127.0.0.1:8765/scan.pdf --docs | grep -q "Scanned invoice 4711"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The same binary the Docker image ships: the image is pinned by digest in the Dockerfile.
      - name: Extract Lightpanda from its image
        run: |
          image=$(sed -n 's/^ARG LIGHTPANDA_IMAGE=//p' Dockerfile)
          id=$(docker create "$image")
          docker cp "$id:/bin/lightpanda" "$RUNNER_TEMP/lightpanda"
          docker rm "$id"
      - run: bun test test/browser.test.ts
        env:
          SEX_TEST_LIGHTPANDA_PATH: ${{ runner.temp }}/lightpanda
