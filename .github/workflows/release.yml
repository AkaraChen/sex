name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    # Only the platforms `@searxng-js/searxng` ships a prebuilt binary for get a self-contained build. Elsewhere
    # SEX_SEARXNG_URL is required, so there is nothing to gain from a release asset.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: bun-linux-x64
            asset: sex-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            asset: sex-darwin-arm64
    runs-on: ${{ matrix.os }}
    env:
      FIRECRAWL_LOCAL_VERSION: "0.1.1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Nothing of firecrawl-local is vendored or forked: the release builds the pinned upstream crate. The binary
      # that ends up in dist/sex is therefore an unmodified AGPL-3.0 build, and nobody needs Rust to run sex.
      - name: Build firecrawl-local (upstream, pinned)
        env:
          TMPDIR: ${{ runner.temp }}
          # The crate asks for fat LTO, which needs ~15 GB and 20+ minutes on a runner. CI builds the same source
          # without it: the release has to fit, and the difference is a few percent of scrape throughput.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo install firecrawl-local --version "$FIRECRAWL_LOCAL_VERSION" --locked --root "$RUNNER_TEMP/firecrawl"
          "$RUNNER_TEMP/firecrawl/bin/firecrawl-local" --version
      - run: bun run build
        env:
          SEX_TARGET: ${{ matrix.target }}
          SEX_LOCAL_VERSION: ${{ env.FIRECRAWL_LOCAL_VERSION }}
          SEX_LOCAL_BINARY: ${{ runner.temp }}/firecrawl/bin/firecrawl-local
      - name: The darwin target needs an arm64 runner
        if: matrix.target == 'bun-darwin-arm64'
        run: test "$(uname -m)" = "arm64"
      - name: Rename and smoke test
        run: |
          mv dist/sex "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          "./${{ matrix.asset }}" version
      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # `gh release create` runs git to resolve the tag, so this job needs a repository too.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cat > NOTES.md <<'EOF'
          sex: one binary. firecrawl-local and SearXNG run as child processes and are embedded.

          firecrawl-local is an unmodified build of the pinned upstream crate (AGPL-3.0):
          https://crates.io/crates/firecrawl-local — source: https://github.com/firecrawl/firecrawl (apps/local)

          /v2/parse needs `here-docs` on PATH or SEX_PARSE_PATH.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file NOTES.md
          fi
